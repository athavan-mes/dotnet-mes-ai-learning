name: Weekly Progress Summary

on:
  schedule:
    - cron: '0 4 * * 0'   # Sunday 09:30 IST
  workflow_dispatch:

jobs:
  summary:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate weekly summary
        run: |
          mkdir -p reports
          echo "# Weekly Progress Summary" > reports/weekly-summary.md
          echo "" >> reports/weekly-summary.md
          echo "## Commit Activity (Last 7 Days)" >> reports/weekly-summary.md
          git log --since="7 days ago" --oneline >> reports/weekly-summary.md || true
          echo "" >> reports/weekly-summary.md
          echo "## Total Commits" >> reports/weekly-summary.md
          git shortlog -s -n >> reports/weekly-summary.md || true
          echo "" >> reports/weekly-summary.md
          echo "_Generated on $(date)_" >> reports/weekly-summary.md

      - name: Upload weekly summary artifact
        uses: actions/upload-artifact@v4
        with:
          name: weekly-progress-summary
          path: reports/weekly-summary.md
